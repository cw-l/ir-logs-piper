      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_rdp.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=22 or EventID=23 or EventID=24 or EventID=25 or EventID=39 or EventID=40)]]"

    - name: winevtlog
      tag: windows.rdp_auth_logs
      channels: Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational
      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_rdp_auth.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=1149)]]"

    - name: winevtlog
      tag: windows.firewall_logs
      channels: Microsoft-Windows-Windows Firewall With Advanced Security/Firewall
      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_firewall.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=2004 or EventID=2005 or EventID=2006 or EventID=2009)]]"

    - name: winevtlog
      tag: windows.defender_logs
      channels: Microsoft-Windows-Windows Defender/Operational
      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_defender.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=1005 or EventID=1006 or EventID=1008 or EventID=1010 or EventID=2001 or EventID=2003 or EventID=3002 or EventID=5001 or EventID=5007 or EventID=5010 or EventID=5012)]]"

    - name: winevtlog
      tag: windows.applocker_exe_logs
      channels: Microsoft-Windows-AppLocker/EXE and DLL
      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_applocker_exe.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=8003 or EventID=8004)]]"

    - name: winevtlog
      tag: windows.applocker_script_logs
      channels: Microsoft-Windows-AppLocker/MSI and Script
      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_applocker_script.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=8005 or EventID=8006 or EventID=8007)]]"

    - name: winevtlog
      tag: windows.wlan_logs
      channels: Microsoft-Windows-WLAN-AutoConfig/Operational
      interval_sec: 5
      db: ${ProgramData}/fluent-bit/data/winevtlog_wlan.db
      storage.type: filesystem
      ignore_missing_channels: true
      read_existing_events: true
      read_limit_per_cycle: 64KB
      event_query: "*[System[(EventID=8001 or EventID=8003)]]"